# Git hooks run before every commit: hygiene checks, secret scan, author email, ruff, mypy.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: ["--branch", "main"]
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
      - id: author-email
        name: author email is GitHub noreply
        entry: scripts/check-author-email.sh
        language: script
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff (lint)
        entry: bash -c 'cd backend && uv run --frozen ruff check --fix .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff (format)
        entry: bash -c 'cd backend && uv run --frozen ruff format .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy (types)
        entry: bash -c 'cd backend && uv run --frozen mypy app tests scripts migrations'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
