# CI: lint, type-check and test the backend (against real Postgres + Redis) and the web app, and scan history for secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # Throwaway credentials for the disposable CI database; not secrets.
    env:
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: ci-only-throwaway
      POSTGRES_DB: nebula
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nebula
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: nebula_test # tests use <POSTGRES_DB>_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nebula -d nebula_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app tests scripts migrations
      - name: Test
        run: uv run pytest
      # The committed schema must match the code, or the frontend's generated types are stale.
      - name: OpenAPI schema is up to date
        run: uv run python -m scripts.export_openapi | diff -u ../docs/openapi.json - || (echo "Run 'make api-types' and commit the result." && exit 1)

  frontend:
    name: Frontend (lint · types · tests · build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generated API types match the schema
        run: |
          npm run api-types && npx prettier --write src/api/schema.d.ts
          git diff --exit-code -- src/api/schema.d.ts || (echo "Run 'make api-types' and commit the result." && exit 1)
      - name: Lint · format · types · tests · build
        run: npm run check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
