# Local stack. `make db-up` starts only Postgres and Redis (for `make dev`); `make up` adds the
# `app` profile: migrations, the API and the web app, all built from this repo.
# Credentials come from .env (see .env.example). Published ports are bound to 127.0.0.1, so
# nothing is reachable from the local network; the API itself is not published at all.
name: nebula

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

x-api-env: &api-env
  env_file: .env
  environment:
    APP_ENV: production
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CORS_ORIGINS: http://localhost:${WEB_PORT:-8080}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies pending migrations, then exits. The API waits for it to succeed.
  migrate:
    profiles: [app]
    image: nebula-api:local
    build: ./backend
    <<: [*hardened, *api-env]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: [app]
    image: nebula-api:local
    build: ./backend
    <<: [*hardened, *api-env]
    restart: unless-stopped
    expose: ["8000"] # other containers only; no host port
    # Readiness, not liveness: `web` should only start once the API can reach its database.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    profiles: [app]
    image: nebula-web:local
    build: ./frontend
    <<: *hardened
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
