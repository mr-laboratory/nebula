# Serves the built web app and forwards /api to the API container, so the browser sees one
# origin (no CORS, and the SameSite=Strict refresh cookie works as in development).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    # Static files only. Proxied API responses are left alone (gzip_proxied is off): the API
    # compresses its own and deliberately never compresses auth responses (BREACH).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the API trusts this header for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Hashed file names change whenever the content does, so they can be cached for good.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes (/p/some-post, /u/ada) all load the app shell, which is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
